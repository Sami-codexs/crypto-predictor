# =============================================================================
# CryptoMind Docker Compose
# Orchestrates API + Dashboard + Scheduler + Ollama AI Layer
# =============================================================================

version: '3.8'

services:
  # ─── Main FastAPI Service ───
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cryptomind-api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - crypto-data:/app/data
      - crypto-models:/app/models
      - crypto-logs:/app/logs
    environment:
      - ENV=production
      - DB_PATH=/app/data/crypto.db
      - MODELS_DIR=/app/models
      - LOGS_DIR=/app/logs
      - DATA_DIR=/app/data
      - API_PORT=8000
      - DASHBOARD_PORT=8501
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.1
      - COINGECKO_API_URL=https://api.coingecko.com/api/v3
      - FETCH_INTERVAL_MINUTES=60
      - LLM_CACHE_TTL_HOURS=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - ollama
    networks:
      - cryptomind-net

  # ─── Streamlit Dashboard ───
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cryptomind-dashboard
    command: >
      sh -c "sleep 10 &&
             streamlit run dashboard.py
             --server.port=8501
             --server.address=0.0.0.0
             --server.headless=true
             --server.enableCORS=false
             --server.enableXsrfProtection=false"
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - crypto-data:/app/data
      - crypto-models:/app/models
      - crypto-logs:/app/logs
    environment:
      - ENV=production
      - DB_PATH=/app/data/crypto.db
      - MODELS_DIR=/app/models
      - OLLAMA_HOST=http://ollama:11434
    restart: unless-stopped
    depends_on:
      - api
      - ollama
    networks:
      - cryptomind-net

  # ─── Scheduler / Data Pipeline ───
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cryptomind-scheduler
    command: >
      sh -c "sleep 15 &&
             python -m src.scheduler"
    volumes:
      - crypto-data:/app/data
      - crypto-models:/app/models
      - crypto-logs:/app/logs
    environment:
      - ENV=production
      - DB_PATH=/app/data/crypto.db
      - MODELS_DIR=/app/models
      - DATA_DIR=/app/data
      - OLLAMA_HOST=http://ollama:11434
      - FETCH_INTERVAL_MINUTES=60
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - cryptomind-net

  # ─── Ollama AI Service ───
  ollama:
    image: ollama/ollama:latest
    container_name: cryptomind-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    restart: unless-stopped
    # Pull llama3.1 on first start
    entrypoint: >
      sh -c "ollama serve &
             sleep 5 &&
             ollama pull llama3.1 &&
             wait"
    networks:
      - cryptomind-net

# ─── Named Volumes ───
volumes:
  crypto-data:
    driver: local
  crypto-models:
    driver: local
  crypto-logs:
    driver: local
  ollama-data:
    driver: local

# ─── Networks ───
networks:
  cryptomind-net:
    driver: bridge